spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/test?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

external:
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    base-url: ${NAVER_BASE_URL}

  api-football:
    api-key: ${API_FOOTBALL_KEY}
    api-base-uri: ${API_BASE_URI}

retry:
  team-statistics:
    max-attempts: ${RETRY_TEAM_STATISTICS_MAX_ATTEMPTS}
    delay: ${RETRY_TEAM_STATISTICS_DELAY}
